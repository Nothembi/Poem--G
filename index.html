    <main>
        <form>
            <input type="text"placeholder="Enter a topic for your poem" autofocus 
            id="themeInput" required 
            autocomplete="off"
            class="instructions"/>
            <Input type="submit" class="submit-button"/>
        </form>
<div class="poem">
    Underneath my outside face
    <br>
    There's a face that none can see.
    <br>
    A little less smiley,
    <br>
</div>
