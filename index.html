<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Baby Names Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Baby Names Generator</h1>
      </header>

      
      <main>
        <div class="form-container">
          <form id="baby-names-generator-form">
            <input
              type="text"
              placeholder="Enter Baby Name"
              autofocus
              required
              autocomplete="off"
              class="instructions"
              id="user-instructions"
            />
            <input type="submit" class="submit-button" />
          </form>
          <div class="hint">i.e: James, Ashley or Koffi</div>
        </div>
        <div class="names hidden" id="names"></div>
      </main>


    <footer>
        This was coded by 
        <a href="https://github.com/Nothembi" target="_blank">Nothembi Job</a> and is
         <a href="https://github.com/Nothembi/Poem--G" target="_blank">
            andis open-source on Github</a
            > 
            and is <a href="https://gleaming-stroopwafel-2950b6.netlify.app/" target="_blank"> hosted on Netlify. 
    </footer>
    </div>


    <script src="src/index.js"></script>
</body>
</html>
